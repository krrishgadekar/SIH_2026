<svg xmlns="http://www.w3.org/2000/svg" width="680" height="586" viewBox="0 0 680 586" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.c-teal rect{fill:#e0f2f1;stroke:#00796b;stroke-width:1;}
.c-purple rect{fill:#ede7f6;stroke:#5e35b1;stroke-width:1;}
.c-coral rect{fill:#fbe9e7;stroke:#d84315;stroke-width:1;}
.c-amber rect{fill:#fff8e1;stroke:#ff8f00;stroke-width:1;}
.th{font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:700;fill:#212121;}
.ts{font-family:Arial,Helvetica,sans-serif;font-size:12px;fill:#555555;}
.arr{stroke:#757575;stroke-width:1.5;fill:none;}
</style>
<rect width="680" height="586" fill="#ffffff"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#757575" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<g class="c-teal">
<rect x="90" y="40" width="500" height="56" rx="8"/>
<text class="th" x="340" y="62" text-anchor="middle">Capture — app layer</text>
<text class="ts" x="340" y="82" text-anchor="middle">Dedicated fundus camera, patient ID</text>
</g>
<line x1="340" y1="96" x2="340" y2="130" class="arr" marker-end="url(#arrow)"/>

<g class="c-purple">
<rect x="90" y="130" width="500" height="56" rx="8"/>
<text class="th" x="340" y="152" text-anchor="middle">Quality gate — ML (local)</text>
<text class="ts" x="340" y="172" text-anchor="middle">Accept, enhance, or reject with retake</text>
</g>
<line x1="340" y1="186" x2="340" y2="220" class="arr" marker-end="url(#arrow)"/>

<g class="c-purple">
<rect x="90" y="220" width="500" height="56" rx="8"/>
<text class="th" x="340" y="242" text-anchor="middle">Segment + grade — ML (central)</text>
<text class="ts" x="340" y="262" text-anchor="middle">Lesions, severity 0-4, calibrated uncertainty</text>
</g>
<line x1="340" y1="276" x2="340" y2="310" class="arr" marker-end="url(#arrow)"/>

<g class="c-purple">
<rect x="90" y="310" width="500" height="56" rx="8"/>
<text class="th" x="340" y="332" text-anchor="middle">Explainability — ML (central)</text>
<text class="ts" x="340" y="352" text-anchor="middle">Grad-CAM, lesion evidence, confidence</text>
</g>
<line x1="340" y1="366" x2="340" y2="400" class="arr" marker-end="url(#arrow)"/>

<g class="c-coral">
<rect x="90" y="400" width="500" height="56" rx="8"/>
<text class="th" x="340" y="422" text-anchor="middle">Human review — ophthalmologist</text>
<text class="ts" x="340" y="442" text-anchor="middle">Confirms or overrides, under 30 seconds</text>
</g>
<line x1="340" y1="456" x2="340" y2="490" class="arr" marker-end="url(#arrow)"/>

<g class="c-amber">
<rect x="90" y="490" width="500" height="56" rx="8"/>
<text class="th" x="340" y="512" text-anchor="middle">Referral + district ops — systems</text>
<text class="ts" x="340" y="532" text-anchor="middle">Priority queue, Simulink resource model</text>
</g>
</svg>
