<svg xmlns="http://www.w3.org/2000/svg" width="680" height="590" viewBox="0 0 680 590" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.c-teal rect{fill:#e0f2f1;stroke:#00796b;stroke-width:1;}
.c-purple rect{fill:#ede7f6;stroke:#5e35b1;stroke-width:1;}
.c-gray rect{fill:#f5f5f5;stroke:#9e9e9e;stroke-width:1;}
.th{font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:700;fill:#212121;}
.ts{font-family:Arial,Helvetica,sans-serif;font-size:12px;fill:#555555;}
.arr{stroke:#757575;stroke-width:1.5;fill:none;}
</style>
<rect width="680" height="590" fill="#ffffff"/>
<defs>
<marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#757575" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text class="ts" x="220" y="45" text-anchor="middle">Dedicated fundus camera</text>
<line x1="220" y1="55" x2="220" y2="88" class="arr" marker-end="url(#arrow2)"/>

<g class="c-teal">
<rect x="40" y="90" width="600" height="200" rx="20"/>
<text class="th" x="340" y="122" text-anchor="middle">PHC site</text>
<text class="ts" x="340" y="140" text-anchor="middle">Runs fully offline, modest hardware</text>
</g>

<g class="c-gray">
<rect x="60" y="170" width="270" height="90" rx="12"/>
<text class="th" x="195" y="200" text-anchor="middle">Capture + quality gate</text>
<text class="ts" x="195" y="218" text-anchor="middle">Retake decision only, no DR grading</text>
</g>

<g class="c-gray">
<rect x="350" y="170" width="270" height="90" rx="12"/>
<text class="th" x="485" y="200" text-anchor="middle">Local database</text>
<text class="ts" x="485" y="218" text-anchor="middle">Captures, records, sync queue</text>
</g>

<line x1="340" y1="290" x2="340" y2="358" class="arr" marker-end="url(#arrow2)"/>
<text class="ts" x="355" y="315" text-anchor="start">Real-time when online;</text>
<text class="ts" x="355" y="332" text-anchor="start">chunked store-and-forward</text>
<text class="ts" x="355" y="349" text-anchor="start">when offline</text>

<g class="c-purple">
<rect x="40" y="360" width="600" height="200" rx="20"/>
<text class="th" x="340" y="392" text-anchor="middle">Central system (cloud)</text>
<text class="ts" x="340" y="410" text-anchor="middle">Full grading pipeline, web app, case database</text>
</g>

<g class="c-gray">
<rect x="60" y="440" width="270" height="90" rx="12"/>
<text class="th" x="195" y="470" text-anchor="middle">Ophthalmologist view</text>
<text class="ts" x="195" y="488" text-anchor="middle">Review queue, Grad-CAM, confirm</text>
</g>

<g class="c-gray">
<rect x="350" y="440" width="270" height="90" rx="12"/>
<text class="th" x="485" y="470" text-anchor="middle">District admin view</text>
<text class="ts" x="485" y="488" text-anchor="middle">Aggregate throughput, referrals</text>
</g>
</svg>
